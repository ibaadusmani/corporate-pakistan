name: Validate data and application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/compile-data.mjs
      - run: npm run check
      - run: git diff --exit-code -- data/ownership.json data/relationships.csv
